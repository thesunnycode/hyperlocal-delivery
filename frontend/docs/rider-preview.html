<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:13px/1.5 system-ui;background:#f7f9fb}/* The rider illustration — its own scope, because it renders in two very
   different places: the auth panel and the customer tracking page.

   It used to live entirely inside auth.css: the palette on the `.auth` root,
   the animation classes named `.auth-*`. That worked while the drawing had one
   home. Rendering it anywhere else would have meant either dragging the whole
   auth palette along or keeping a second copy of the same keyframes, so the
   illustration owns its own tokens and classes instead. Nothing here depends
   on the surface it sits on.

   ── Redesign notes ─────────────────────────────────────────────────────
   The palette below now derives from styles/tokens.css rather than carrying
   its own blues. Two consequences worth knowing:

     · The scooter was #2c437b, a navy chosen to sit on the old navy auth
       panel. Against the new emerald brand a blue vehicle competed with the
       primary action for the eye. It is a deep slate now — the same neutral
       family as the rest of the product — which leaves the hi-vis jacket and
       the status parcels as the only saturated things in the frame. That is
       the correct hierarchy: the courier and the cargo are the subject.

     · Every mass now has a -dk and a -hi sibling, because the enhanced drawing
       shades in two layers. Light comes from up and to the left, everywhere.

   Animation rules (all off under prefers-reduced-motion):
    - The WHEELS are a separate group and never move. Only `.ri-bob` groups
      travel, so the scooter reads as suspension rather than hovering.
    - The ground shadow scales and fades in counter-phase to that bob.
    - One `--ri-spd` drives everything: wheels and speed streaks share it, the
      bob is 2x, the parcels 3x, the headlight 4x. Unrelated durations made the
      wheel spin and the streaks visibly drift apart. */

.ri {
  /* ── vehicle ── */
  /* Surface-dependent, like the cargo box. A single mid-slate cannot separate
     from a #0f172a panel AND from a #f7f9fb page — on the dark one the whole
     vehicle sank into the background and the drawing read as a rider floating
     between two wheels. Dark surfaces get the lighter pair. */
  --ri-scoot: #8391a8;
  --ri-scoot-hi: #adb9cb;
  --ri-scoot-dk: #5d6a80;
  --ri-seat: #232c38;
  --ri-seat-hi: #4a5769;
  --ri-tyre: #2a3340;
  --ri-tread: #39424f;
  --ri-rim: #9aa5b6;
  --ri-grip: #454f5e;
  --ri-lamp: #ffd06b;
  --ri-mirror: #dfe5ee;

  /* ── rider ──
     The jacket stays warm and saturated: it is the one thing in the frame
     that should be found first, and a courier in a dark jacket on a dark
     scooter is a silhouette rather than a person. */
  --ri-jacket: #e8912a;
  --ri-jacket-hi: #ffb457;
  --ri-jacket-dk: #a8631a;
  --ri-vest: #f6e05e;
  --ri-skin: #d9a06a;
  --ri-skin-dk: #b07c4c;
  --ri-helmet: #eef1f6;
  --ri-helmet-hi: #ffffff;
  --ri-helmet-dk: #b9c3d2;
  --ri-visor: #3d4a5c;
  --ri-trouser: #8794a8;
  --ri-trouser-hi: #aab5c5;
  --ri-trouser-dk: #5e6a7a;

  /* Generic ink for the shading overlays, so a shadow is one token rather
     than a rgba() repeated eleven times at three different alphas. */
  --ri-ink: #0f172a;

  /* The brand square on the cargo box. Read `--auth-brand` before this scope
     existed, so it drew as a transparent hole anywhere but the auth panel. */
  --ri-brand: var(--hl-brand-solid, #007a56);

  /* Status hues used by the floating parcels. Same values the app uses
     inside, so the vocabulary is consistent from the door onwards. */
  --ri-st-picked: var(--hl-picked_up-solid, #1d4ed8);
  --ri-st-ofd: var(--hl-out_for_delivery-solid, #b34700);
  --ri-st-delivered: var(--hl-delivered-solid, #007a56);
  --ri-st-failed: var(--hl-failed-solid, #c81e1e);

  /* Surface-dependent. The drawing was built for a dark panel, where a white
     cargo box and pale streaks read fine. Both disappear on a light ground,
     so they are tokens and `.on-light` retunes them. */
  --ri-box: #ffffff;
  --ri-box-hi: #ffffff;
  --ri-box-line: transparent;
  --ri-ground: #05070c;
  --ri-streak: #66748a;
  --ri-streak-o: 0.4;

  --ri-spd: 1.1s;

  width: 100%;
  max-width: 660px;
  height: auto;
}

@keyframes ri-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes ri-shadow { 0%, 100% { transform: scale(1); opacity: 0.55; } 50% { transform: scale(0.9, 0.86); opacity: 0.4; } }
@keyframes ri-spin { to { transform: rotate(360deg); } }
@keyframes ri-streak { to { transform: translateX(-46px); } }
@keyframes ri-drift {
  0%, 100% { transform: translateY(0) rotate(var(--ri-rot, 0deg)); }
  50% { transform: translateY(-9px) rotate(calc(var(--ri-rot, 0deg) + 4deg)); }
}

.ri-bob { animation: ri-bob calc(var(--ri-spd) * 2) ease-in-out infinite; }
.ri-shadow {
  transform-box: view-box; transform-origin: 280px 356px;
  animation: ri-shadow calc(var(--ri-spd) * 2) ease-in-out infinite;
}
/* view-box + an explicit wheel-centre origin. transform-box:fill-box with a
   `center` origin only worked here by accident of symmetric rects. */
.ri-spoke { transform-box: view-box; animation: ri-spin var(--ri-spd) linear infinite; }
.ri-spoke-rear { transform-origin: 180px 296px; }
.ri-spoke-front { transform-origin: 382px 296px; }
.ri-streaks { animation: ri-streak var(--ri-spd) linear infinite; }
/* fill-box here, NOT view-box: each parcel rotates about its own centre.
   With view-box they would orbit the middle of the whole drawing. */
.ri-parcel {
  transform-box: fill-box; transform-origin: center;
  transform: rotate(var(--ri-rot, 0deg));
  animation: ri-drift calc(var(--ri-spd) * 3) ease-in-out infinite;
}

/* For a light background: the cargo box gains an edge instead of vanishing,
   the streaks darken enough to read as motion rather than as smudges, and the
   ground shadow softens to a slate that does not punch a hole in the page. */
.ri.on-light {
  --ri-scoot: #58657a;
  --ri-scoot-hi: #808da2;
  --ri-scoot-dk: #3c4657;
  --ri-tyre: #1c2430;
  --ri-tread: #2a323e;
  --ri-rim: #8792a3;
  --ri-grip: #333d4b;
  --ri-mirror: #ffffff;
  --ri-box: #f1f5f9;
  --ri-box-hi: #ffffff;
  --ri-box-line: #cfd8e4;
  --ri-ground: #45505f;
  --ri-streak: #808c9e;
  --ri-streak-o: 0.5;
  /* The lamp keeps its warmth on light ground rather than being switched off.
     With the beam gone there is no glow to fail — a small amber lens inside a
     white housing reads on both surfaces, and it is the only warm note on the
     vehicle, which is what makes the front of the bike findable. */
  --ri-lamp: #f0a92e;
}

/* `still` is for surfaces that want the drawing without the motion — a
   delivery that has already finished, or failed, where a scooter tearing
   along would be saying the wrong thing. */
.ri.still .ri-bob, .ri.still .ri-shadow, .ri.still .ri-spoke,
.ri.still .ri-streaks, .ri.still .ri-parcel { animation: none; }
.ri.still .ri-shadow { opacity: 0.55; }
/* A stopped scooter has no slipstream. Leaving the streaks in place under
   `still` was the one thing that gave the state away as a paused animation
   rather than a parked bike. */
.ri.still .ri-streaks { display: none; }

@media (prefers-reduced-motion: reduce) {
  .ri-bob, .ri-shadow, .ri-spoke, .ri-streaks, .ri-parcel { animation: none; }
  .ri-shadow { opacity: 0.55; }
}
