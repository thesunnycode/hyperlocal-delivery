<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hyperlocal</title>
<!-- Fonts are linked here rather than @imported from CSS, so the request can
     start in parallel with the stylesheet — it matters most on the public
     /track/:token page, which arrives cold from a WhatsApp link on mobile data.

     Three faces, each doing one job (see styles/tokens.css):
       Bricolage Grotesque  display — headlines and figures. Replaces
         Instrument Serif, which was charming on the auth page and turned to
         mush at 19px on a rider's phone in sunlight.
       Instrument Sans      all UI and body copy. Replaces IBM Plex Sans:
         narrower, so the register's seven columns fit without shrinking.
       JetBrains Mono       anything read digit by digit — ₹ amounts, +91
         numbers, tracking tokens, timestamps, table figures.

     Mono is a deliberate reversal of this app's previous "no second face"
     rule: the system mono stack renders at a different width on every machine,
     and this product's tables are full of numbers that need to line up.
     Weights are pruned to the five actually used, so the critical path is not
     paying for a family it renders three sizes of. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
