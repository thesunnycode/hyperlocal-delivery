spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        query.fail_on_pagination_over_collection_fetch: false
    defer-datasource-initialization: true
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-that-is-at-least-32-bytes-long-for-hs256
    access-ttl-minutes: 60
    refresh-ttl-days: 1
  cors:
    allowed-origins: "*"
  mail:
    reset-link-base-url: http://localhost:5173/reset-password
    reset-token-ttl-minutes: 30
