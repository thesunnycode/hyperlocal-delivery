spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hyperlocal_delivery_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-that-is-at-least-32-bytes-long-for-hs256
    access-ttl-minutes: 60
    refresh-ttl-days: 1
  cors:
    allowed-origins: "*"
  mail:
    reset-link-base-url: http://localhost:5173/reset-password
    reset-token-ttl-minutes: 30
